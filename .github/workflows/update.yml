name: Update stats

on:
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC; off the hour, when GitHub drops scheduled runs less (~1 request per player; free plan allows 100/day)
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Override seasons, e.g. "2025,2024" (blank = current + previous)'
        required: false
  push:
    branches: [main]
    paths: [players.json]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch stats
        run: node scripts/fetch.mjs
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SEASONS: ${{ inputs.seasons }}
          # A players.json push only needs the new players; regrouping or removing costs no requests.
          NEW_ONLY: ${{ github.event_name == 'push' && '1' || '' }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json docs/data.json docs/history.json docs/profiles.json
          # Skip the commit when only the timestamp changed (no new matches played).
          if git diff --cached --quiet -I '"generatedAt":'; then
            echo "No stat changes; nothing to commit."
          else
            git commit -m "Update stats $(date -u +%F)"
            git push
          fi
