<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1><a href="./" class="home" title="Back to all players (clears filters)">Player Tracker</a></h1>
      <p id="updated" class="muted"></p>
      <p id="next-matches" class="muted small"></p>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search player or club" aria-label="Search player or club" autocomplete="off">
      <select id="group" aria-label="Group" hidden></select>
      <select id="position" aria-label="Position">
        <option value="all">All positions</option>
        <option value="gk">Goalkeepers</option>
        <option value="def">Defenders</option>
        <option value="mid">Midfielders</option>
        <option value="fwd">Forwards</option>
      </select>
      <select id="category" aria-label="Competition">
        <option value="club">All club competitions</option>
        <option value="league">League</option>
        <option value="cup">Cups</option>
        <option value="europe">Europe</option>
      </select>
      <div class="seg" id="season-seg" role="group" aria-label="Season"></div>
      <label class="check"><input id="played" type="checkbox"> Played only</label>
      <label class="check" id="split-label" hidden><input id="split" type="checkbox"> Split by group</label>
    </div>
  </header>

  <div id="notices"></div>

  <main>
    <section class="card" id="player" hidden></section>

    <section class="card" id="whatsnew" hidden>
      <div class="card-head">
        <h2>What's new</h2>
        <span id="whatsnew-range" class="muted small"></span>
      </div>
      <div id="whatsnew-body"></div>
    </section>

    <section class="card" id="overview-card">
      <div class="card-head">
        <h2>Overview</h2>
        <span class="muted small">Click a row for the competition breakdown · tick 2–4 players to compare ·
          <span class="trend up">▲</span><span class="trend down">▼</span> per-90 vs last season (270+ min each)</span>
      </div>
      <div class="table-wrap">
        <table id="overview">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="empty" class="muted" hidden></p>
    </section>

    <section class="card" id="compare" hidden>
      <div class="card-head">
        <h2>Compare</h2>
        <button id="clear-compare" class="link">Clear</button>
      </div>
      <div id="compare-body"></div>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
